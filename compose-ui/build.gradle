plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.anadolstudio.compose.ui'
    compileSdk 34

    defaultConfig {
        minSdk 23
        targetSdk 34

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion = "1.4.7"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
        freeCompilerArgs = freeCompilerArgs + ["-opt-in=androidx.compose.foundation.ExperimentalFoundationApi"]
    }
}

dependencies {
    // Choose one of the following:
    // Material Design 3
    api 'androidx.navigation:navigation-compose:2.6.0'
    api 'com.google.accompanist:accompanist-navigation-material:0.31.3-beta'
    api 'com.google.accompanist:accompanist-systemuicontroller:0.31.3-beta'
    // or Material Design 2
    api 'androidx.compose.material:material:1.6.4'
    // or skip Material Design and build directly on top of foundational components
    api 'androidx.compose.foundation:foundation:1.6.4'
    // or only import the main APIs for the underlying toolkit systems,
    // such as input and measurement/layout
    api 'androidx.compose.ui:ui:1.6.4'
    api 'androidx.compose.runtime:runtime-livedata:1.6.4'

    // Android Studio Preview support
    api 'androidx.compose.ui:ui-tooling-preview:1.6.4'
    debugImplementation 'androidx.compose.ui:ui-tooling:1.6.4'

    // UI Tests
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4:1.6.4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest:1.6.4'

    // Optional - Included automatically by material, only add when you need
    // the icons but not the material library (e.g. when using Material3 or a
    // custom design system based on Foundation)
    api 'androidx.compose.material:material-icons-core:1.6.4'
    // Optional - Add full set of material icons
    api 'androidx.compose.material:material-icons-extended:1.6.4'
    // Optional - Add window size utils
    api 'androidx.compose.material3:material3-window-size-class:1.2.1'
    api 'androidx.compose.material3:material3:1.2.1'

    // Optional - Integration with activities
    api 'androidx.activity:activity-compose:1.8.2'
    api 'io.coil-kt:coil-compose:2.6.0'
    api 'com.github.skydoves:landscapist-glide:2.3.2'
    api 'com.github.skydoves:landscapist-placeholder:2.3.2'
    // Optional - Integration with ViewModels
    api 'androidx.lifecycle:lifecycle-viewmodel-compose:2.6.1'
    api 'androidx.compose.runtime:runtime'
}
